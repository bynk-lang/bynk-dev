name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""
  # bynk-canary.yml calls this at each new Bynk release, so the scenarios
  # below also run against releases newer than the baseline.
  workflow_call:
    inputs:
      version:
        description: Bynk version to test, exact or "latest" (empty for BYNK_VERSION)
        type: string
        default: ""

permissions:
  contents: read

# Push and pull_request runs use the version in BYNK_VERSION, so a red build
# means the change broke something, not that a new compiler came out. The
# canary proposes moving it once a newer release passes.
env:
  REQUESTED: ${{ inputs.version }}

jobs:
  single:
    name: One context (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"


      - uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/hello
          wrangler-args: --var FROM_TEST:1
          run: |
            test "$(curl -fsS "$BYNK_DEV_URL/hello/Ada")" = '"Hello, Ada!"'
            test "$BYNK_DEV_PORTS" = 8787
            test -s "$BYNK_DEV_LOG"

      - name: Nothing is left running
        shell: bash
        run: |
          if curl -s -o /dev/null --max-time 2 http://localhost:8787/; then
            echo "::error::the server outlived the action"
            exit 1
          fi

  pair:
    name: Two contexts over a Service Binding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"


      - uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/pair
          # The first call across a Service Binding fails until it connects.
          ready-path: /answer
          run: |
            test "$BYNK_DEV_PORTS" = "8787 8788"
            test "$(curl -fsS "$BYNK_DEV_URL_PAIR_WEB/answer")" = '"42"'

  # The action must fail, and tear down, when the script does, and when the
  # project does not build.
  failures:
    name: Failures fail (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose the Bynk version
        shell: bash
        run: echo "BYNK_VERSION=${REQUESTED:-$(tr -d '[:space:]' < BYNK_VERSION)}" >> "$GITHUB_ENV"


      - name: A failing script
        id: script
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/hello
          run: curl -fsS "$BYNK_DEV_URL/no-such-route"

      - name: A project that does not build
        id: build
        continue-on-error: true
        uses: ./
        with:
          version: ${{ env.BYNK_VERSION }}
          working-directory: test/fixtures/broken
          ready-timeout: "60"
          run: "true"

      - name: Both failed
        shell: bash
        env:
          SCRIPT: ${{ steps.script.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          test "$SCRIPT" = failure
          test "$BUILD" = failure

  # version-file reads the pin from a file (BYNK_VERSION here), by the same
  # rules as setup-bynk's: one exact version, and not together with version.
  version-file:
    name: The version comes from a file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A version file
        uses: ./
        with:
          version-file: BYNK_VERSION
          working-directory: test/fixtures/hello
          run: curl -fsS "$BYNK_DEV_URL/hello/Ada"

      - name: A version file and a version
        id: both
        continue-on-error: true
        uses: ./
        with:
          version: 0.404.0
          version-file: BYNK_VERSION
          working-directory: test/fixtures/hello
          run: "true"

      - name: A version file that does not exist
        id: missing
        continue-on-error: true
        uses: ./
        with:
          version-file: NO_SUCH_FILE
          working-directory: test/fixtures/hello
          run: "true"

      - name: Assert
        shell: bash
        env:
          BOTH: ${{ steps.both.outcome }}
          MISSING: ${{ steps.missing.outcome }}
        run: |
          failed=0
          want="bynkc $(tr -d '[:space:]' < BYNK_VERSION)"; want="${want/bynkc v/bynkc }"
          got="$(bynkc --version)"
          [ "$got" = "$want" ] || { echo "::error::installed '$got', BYNK_VERSION says '$want'"; failed=1; }
          [ "$BOTH" = failure ] || { echo "::error::version-file with version was '$BOTH', expected failure"; failed=1; }
          [ "$MISSING" = failure ] || { echo "::error::a missing version-file was '$MISSING', expected failure"; failed=1; }
          exit "$failed"
