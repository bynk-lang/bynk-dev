# Bynk canary: re-run this action against a new Bynk release, and keep a
# `canary` issue open while it fails.
#
# Triggered by the org dispatcher in bynk-lang/.github (on each Bynk release,
# and weekly), which is why there is no `schedule` here. This repository is
# listed in bynk-lang/.github's canary/repos.json (kind `action`), and the
# canary GitHub App is installed on it.
# See https://github.com/bynk-lang/.github/blob/main/canary/README.md
#
# `scenarios` runs test.yml, this repository's own tests, at the dispatched
# version: it boots a one-context and a two-context fixture with `uses: ./`
# and checks the Service Binding, the teardown and the failure paths. A
# release that changes what `bynk dev` prints or how it starts breaks it. Its
# result is passed to canary.yml as `upstream-result`; canary.yml runs no
# checks of its own here (`ci: false`), but resolves the version, records it,
# and opens, updates or closes the one `canary` issue.
name: Bynk canary

on:
  repository_dispatch:
    types: [bynk-canary]
  workflow_dispatch:
    inputs:
      version:
        description: Bynk version, exact ("0.330.4") or "latest"
        type: string
        default: latest

permissions:
  contents: read
  issues: write
  id-token: write   # canary.yml reports with the run's GitHub OIDC token

jobs:
  scenarios:
    name: Scenarios
    uses: ./.github/workflows/test.yml
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}

  canary:
    name: Canary
    needs: scenarios
    if: ${{ !cancelled() }}
    uses: bynk-lang/.github/.github/workflows/canary.yml@v1
    with:
      version: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
      upstream-result: ${{ needs.scenarios.result }}
      kind: action
      ci: false
      bump: true            # propose moving BYNK_VERSION to a newer release that passes
      bump-auto-merge: true # and merge that once its checks pass
    secrets: inherit        # the bump App's BUMP_APP_ID and BUMP_APP_KEY
